server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Catalog Service (REST)
    location /api/ {
        proxy_pass http://catalog-service:8001;
    }

    # Orders Service (GraphQL)
    location /graphql {
        proxy_pass http://orders-service:8002;
    }

    # Image Provider (HTTP)
    location /images/ {
        proxy_pass http://image-provider:8003;
    }
}
