# Each service receives only the variables it uses. Hosts and ports point to
# the internal network; .env keeps the values for running a service locally.
x-metadata-db-environment: &metadata-db-environment
  POSTGRES_HOST: metadataba-db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-metadataba_db}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

x-videos-db-environment: &videos-db-environment
  MINIO_ENDPOINT_URL: http://videos-db:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-streaming-videos}

x-processing-environment: &processing-environment
  <<: [*metadata-db-environment, *videos-db-environment]
  RABBITMQ_HOST: transcoding-broker
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:-video_worker}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local_video_password}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
  HLS_SEGMENT_SECONDS: ${HLS_SEGMENT_SECONDS:-4}
  TRANSCODE_MAX_ATTEMPTS: ${TRANSCODE_MAX_ATTEMPTS:-3}
  TRANSCODE_RETRY_SECONDS: ${TRANSCODE_RETRY_SECONDS:-15}
  WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
  TRANSCODE_TIMEOUT_SECONDS: ${TRANSCODE_TIMEOUT_SECONDS:-3600}
  FFMPEG_THREADS: ${FFMPEG_THREADS:-2}
  WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8091}

x-recommendation-environment: &recommendation-environment
  <<: *metadata-db-environment
  RECOMMENDATION_PORT: ${RECOMMENDATION_PORT:-8088}
  NODE_ENV: ${NODE_ENV} 

  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}

  VIDEO_COLLECTION: ${VIDEO_COLLECTION:-video_embeddings}
  USER_COLLECTION: ${USER_COLLECTION:-user_embeddings}
  EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION}
  TEXT_TEMPLATE_VERSION: ${TEXT_TEMPLATE_VERSION:-video-text-v1}

  DEFAULT_RECOMMENDATION_LIMIT: ${DEFAULT_RECOMMENDATION_LIMIT:-10}
  MAX_RECOMMENDATION_LIMIT: ${MAX_RECOMMENDATION_LIMIT:-50}
  CANDIDATE_MULTIPLIER: ${CANDIDATE_MULTIPLIER:-3}

x-interactions-environment: &interactions-environment
  <<: *metadata-db-environment
  RABBITMQ_HOST: transcoding-broker
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:-video_worker}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local_video_password}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
  MONGODB_URI: mongodb://${INTERACTIONS_DB_USER:-interactions_user}:${INTERACTIONS_DB_PASSWORD:-local_interactions_password}@interactions-db:27017/?authSource=admin
  MONGODB_DB: ${INTERACTIONS_DB_NAME:-interactions}

x-processing-service: &processing-service
  restart: unless-stopped
  environment: *processing-environment
  networks:
    - internal
  init: true

x-embeddings-delivery-environment: &embeddings-delivery-environment
  EMBEDDINGS_URL: http://embeddings-service:8090
  EMBEDDINGS_CONNECT_TIMEOUT_SECONDS: ${EMBEDDINGS_CONNECT_TIMEOUT_SECONDS:-5}
  EMBEDDINGS_RESPONSE_TIMEOUT_SECONDS: ${EMBEDDINGS_RESPONSE_TIMEOUT_SECONDS:-60}
  EMBEDDINGS_RETRY_SECONDS: ${EMBEDDINGS_RETRY_SECONDS:-2}

services:
  metadataba-db:
    image: postgres:16-alpine
    container_name: metadataba-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metadataba_db}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - metadataba_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
      - host-access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  videos-db:
    image: "${MINIO_IMAGE:-elestio/minio:latest}"
    container_name: videos-db
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - videos_data:/data
    networks:
      - internal
      - host-access
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  streaming-service:
    build:
      context: ./streaming_service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: [*metadata-db-environment, *videos-db-environment]
      MINIO_ENDPOINT_URL: http://videos-db:9000
    ports:
      - "127.0.0.1:${STREAMING_PORT:-8082}:8082"
    networks:
      - internal
      - host-access
    depends_on:
      metadataba-db:
        condition: service_healthy
      videos-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8082/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  transcoding-broker:
    build:
      context: .
      dockerfile: ${TRANSCODING_BROKER_DOCKERFILE:-transcoding_broker/Dockerfile}
    image: mvp1-transcoding-broker:local
    hostname: transcoding-broker
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-video_worker}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local_video_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - internal
      - host-access
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  processing-service:
    <<: *processing-service
    environment:
      <<: [*processing-environment, *embeddings-delivery-environment]
      JWT_SECRET: ${JWT_SECRET}
    build:
      context: .
      dockerfile: processing_service/Dockerfile
    image: mvp1-processing-service:local
    ports:
      - "127.0.0.1:${PROCESSING_API_HOST_PORT:-8086}:8086"
    networks:
      - internal
      - host-access
    depends_on:
      metadataba-db:
        condition: service_healthy
      videos-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 15s

  job-dispatcher:
    <<: *processing-service
    image: mvp1-processing-service:local
    command: ["python", "-m", "processing_service.outbox_dispatcher"]
    depends_on:
      processing-service:
        condition: service_healthy
      transcoding-broker:
        condition: service_healthy
    stop_grace_period: 30s

  embeddings-dispatcher:
    restart: unless-stopped
    init: true
    image: mvp1-processing-service:local
    command: ["python", "-m", "processing_service.embeddings_dispatcher"]
    environment:
      <<: [*metadata-db-environment, *embeddings-delivery-environment]
    depends_on:
      processing-service:
        condition: service_healthy
    networks:
      - internal
    stop_grace_period: 75s

  encoder-worker:
    <<: *processing-service
    build:
      context: .
      dockerfile: encoder_worker/Dockerfile
    image: mvp1-encoder-worker:local
    deploy:
      replicas: ${TRANSCODING_WORKER_REPLICAS:-1}
    expose:
      - "8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.getenv('WORKER_HEALTH_PORT', '8091') + '/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    depends_on:
      processing-service:
        condition: service_healthy
      transcoding-broker:
        condition: service_healthy
    # SIGTERM stops new jobs and allows the current encode to finish.
    stop_grace_period: 2m

  users-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
      POSTGRES_DB: users
    ports:
      - "127.0.0.1:${USERS_DB_HOST_PORT:-5434}:5432"
    volumes:
      - users_data:/var/lib/postgresql/data
      - ./auth_service/users_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
      - host-access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

  auth-service:
    build:
      context: ./auth_service
    restart: unless-stopped
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: http://localhost:${API_GATEWAY_HOST_PORT:-6767}/auth/google/callback
      FRONTEND_URL: http://localhost:${FRONTEND_HOST_PORT:-8080}
      DATABASE_URL: postgres://${USERS_DB_USER}:${USERS_DB_PASSWORD}@users-db:5432/users
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - internal
      - host-access
    depends_on:
      users-db:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api_gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_HOST_PORT:-6767}:6767"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      AUTH_URL: http://auth-service:8081
      PROCESSING_URL: http://processing-service:8086
      RECOMMENDATION_URL: http://recommendation-service:${RECOMMENDATION_PORT:-8088}
      INTERACTIONS_URL: http://interactions-service:8087
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_HOST_PORT:-8080}
    networks:
      - internal
      - host-access
    depends_on:
      - auth-service
      - processing-service
      - recommendation-service
      - interactions-service

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${API_GATEWAY_HOST_PORT:-6767}
        VITE_STREAMING_URL: http://localhost:${STREAMING_PORT:-8082}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    networks:
      - host-access
    depends_on:
      - api-gateway

  recommendation-service:
    build:
      context: ./recommendation_service
    container_name: recommendation-service
    restart: unless-stopped
    init: true
    environment:
      <<: *recommendation-environment
    expose:
      - "${RECOMMENDATION_PORT:-8088}"
    depends_on:
      - metadataba-db
      - qdrant
    networks:
      - internal

  embeddings-service:
    build:
      context: ./embeddings_service
    restart: unless-stopped
    init: true
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-5}
      EMBEDDING_MODEL_ROOT: /models
      EMBEDDING_MODEL_KEY: ${EMBEDDING_MODEL_KEY:-}
      EMBEDDING_CPU_THREADS: ${EMBEDDING_CPU_THREADS:-4}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION}
      VIDEO_COLLECTION: ${VIDEO_COLLECTION:-video_embeddings}
      USER_COLLECTION: ${USER_COLLECTION:-user_embeddings}
      QDRANT_INIT_RETRY_SECONDS: ${QDRANT_INIT_RETRY_SECONDS:-5}
      EMBEDDING_STATE_ROOT: /var/lib/embeddings
      VIDEO_LOCK_TIMEOUT_SECONDS: ${VIDEO_LOCK_TIMEOUT_SECONDS:-5}
      USER_LOCK_TIMEOUT_SECONDS: ${USER_LOCK_TIMEOUT_SECONDS:-5}
    volumes:
      - ./artifacts/embeddings/models:/models:ro
      - embeddings_state:/var/lib/embeddings
    expose:
      - "8090"
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - internal
      - host-access

  interactions-db:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${INTERACTIONS_DB_USER:-interactions_user}
      MONGO_INITDB_ROOT_PASSWORD: ${INTERACTIONS_DB_PASSWORD:-local_interactions_password}
    ports:
      - "127.0.0.1:${INTERACTIONS_DB_HOST_PORT:-27017}:27017"
    volumes:
      - interactions_data:/data/db
    networks:
      - internal
      - host-access
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  interactions-service:
    build:
      context: .
      dockerfile: interactions_service/Dockerfile
    image: mvp1-interactions-service:local
    restart: unless-stopped
    init: true
    environment:
      <<: *interactions-environment
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:${INTERACTIONS_API_HOST_PORT:-8087}:8087"
    networks:
      - internal
      - host-access
    depends_on:
      interactions-db:
        condition: service_healthy
      metadataba-db:
        condition: service_healthy
      transcoding-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8087/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 15s

  interaction-worker:
    build:
      context: .
      dockerfile: interaction_worker/Dockerfile
    image: mvp1-interaction-worker:local
    restart: unless-stopped
    init: true
    environment:
      <<: *interactions-environment
      WORKER_HEALTH_PORT: "8092"
      EMBEDDINGS_API_URL: ${EMBEDDINGS_API_URL:-http://embeddings-service:8090}
      EMBEDDINGS_CONNECT_TIMEOUT_SECONDS: ${EMBEDDINGS_CONNECT_TIMEOUT_SECONDS:-5}
      EMBEDDINGS_RESPONSE_TIMEOUT_SECONDS: ${EMBEDDINGS_RESPONSE_TIMEOUT_SECONDS:-60}
      PROFILE_UPDATE_THRESHOLD: ${PROFILE_UPDATE_THRESHOLD:-10}
      PROFILE_RETRY_SECONDS: ${PROFILE_RETRY_SECONDS:-2}
      PROFILE_LEASE_SECONDS: ${PROFILE_LEASE_SECONDS:-120}
      PROFILE_SWEEP_SECONDS: ${PROFILE_SWEEP_SECONDS:-1}
    deploy:
      replicas: ${INTERACTION_WORKER_REPLICAS:-1}
    expose:
      - "8092"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    depends_on:
      interactions-db:
        condition: service_healthy
      transcoding-broker:
        condition: service_healthy
    stop_grace_period: 75s

volumes:
  metadataba_data:
    name: metadataba_data
  videos_data:
    name: videos_data
  rabbitmq_data:
    name: mvp1_rabbitmq_data
  redis_data:
    name: redis_streaming_data
  users_data:
    name: users_data
  qdrant_data:
    name: qdrant_data
  embeddings_state:
    name: mvp1_embeddings_state
  interactions_data:
    name: interactions_data

networks:
  internal:
    name: metadataba_internal
    internal: true
    driver: bridge
  host-access:
    name: metadataba_host_access
    driver: bridge
