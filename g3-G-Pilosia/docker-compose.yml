name: pilosia

services:
  # ---------- Presentación ----------
  frontend:
    build:
      context: ./frontend
      args:
        API_GATEWAY_URL: http://api-gateway:8080
    ports:
      - "8080:3000"
    environment:
      API_GATEWAY_URL: http://api-gateway:8080
    depends_on:
      - api-gateway

  admin-dashboard:
    build: ./admin-dashboard
    ports:
      - "8081:80"
    depends_on:
      - api-gateway

  api-gateway:
    build: ./api-gateway
    environment:
      API_TARGET: http://courses-service:8000
      GRAPHQL_TARGET: http://grades-service:4000
      NOTIFICATIONS_TARGET: http://notifications-service:8081
    ports:
      - "8000:8080"
    depends_on:
      - courses-service
      - grades-service
      - notifications-service

  # ---------- Lógica ----------
  courses-service:
    build: ./courses-service
    environment:
      DATABASE_URL: postgresql://pilosia:pilosia@courses-db:5432/courses_db
      CURRENT_PERIOD: "2025-2"
      RABBITMQ_URL: amqp://pilosia:pilosia@rabbitmq:5672/
    depends_on:
      courses-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  grades-service:
    build: ./grades-service
    environment:
      MONGO_URL: mongodb://grades-db:27017
      COURSES_SERVICE_URL: http://courses-service:8000
    depends_on:
      grades-db:
        condition: service_healthy
      courses-service:
        condition: service_started

  notifications-service:
    build: ./notifications-service
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: pilosia
      SPRING_RABBITMQ_PASSWORD: pilosia
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: pilosia
      RABBITMQ_DEFAULT_PASS: pilosia
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Datos ----------
  courses-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: courses_db
      POSTGRES_USER: pilosia
      POSTGRES_PASSWORD: pilosia
    volumes:
      - ./databases/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - courses-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilosia -d courses_db"]
      interval: 5s
      retries: 10

  grades-db:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: grades_db
    volumes:
      - ./databases/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
      - grades-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

volumes:
  courses-data:
  grades-data:
