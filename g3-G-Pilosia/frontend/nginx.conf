server {
    listen 80;

    # Archivos del frontend (React compilado)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Llamadas REST -> courses-service
    location /api/ {
        proxy_pass http://courses-service:8000;
    }

    # Llamadas GraphQL -> grades-service
    location /graphql {
        proxy_pass http://grades-service:4000;
    }
}
