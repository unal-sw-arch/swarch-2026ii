# infra/redis/conf/coord.conf — redis-coord: locks (y rate limiting en Fase 3)
# OJO: Redis NO admite comentarios en la misma línea que una directiva
# (p. ej. `maxmemory 700mb  # ...` da "wrong number of arguments"). Cada comentario en su propia línea.

# aceptable: la red Docker es interna y NO se publican puertos
bind 0.0.0.0
protected-mode yes
port 6379
aclfile /usr/local/etc/redis/users.acl

# ≈ 70 % del mem_limit del contenedor (1g)
maxmemory 700mb
# los locks NUNCA se expulsan (perder un lock es un bug de corrección)
maxmemory-policy noeviction

appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000
dir /data

timeout 300
tcp-keepalive 60
loglevel notice

# --- Producción con TLS (Fase 7) ---
# port 0
# tls-port 6379
# tls-cert-file /run/secrets/redis.crt
# tls-key-file  /run/secrets/redis.key
# tls-ca-cert-file /run/secrets/ca.crt
# tls-auth-clients optional
