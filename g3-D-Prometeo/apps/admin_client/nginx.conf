# Configuración de nginx para servir el build web de Flutter (SPA).
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Flutter web es una SPA: cualquier ruta desconocida cae en index.html
    # para que el router del cliente la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flutter web NO pone hash en los nombres de sus archivos (main.dart.js,
    # flutter_bootstrap.js, assets/...). Cachearlos como `immutable` hace que el
    # navegador siga ejecutando un build viejo tras redesplegar. `no-cache`
    # obliga a revalidar con ETag: si no cambió, responde 304 sin re-descargar.
    add_header Cache-Control "no-cache" always;
}
