name: kanasta

services:
  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - catalog-service
      - orders-service
      - image-provider

  catalog-service:
    build: ./catalog-service
    environment:
      DATABASE_URL: postgresql://kanasta:kanasta@catalog-db:5432/catalog
    ports:
      - "8001:8001"
    depends_on:
      catalog-db:
        condition: service_healthy

  orders-service:
    build: ./orders-service
    environment:
      MONGO_URL: mongodb://orders-db:27017
      MONGO_DB: orders
      CATALOG_URL: http://catalog-service:8001
    ports:
      - "8002:8002"
    depends_on:
      orders-db:
        condition: service_healthy
      catalog-service:
        condition: service_started

  image-provider:
    build: ./image-provider
    ports:
      - "8003:8003"

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kanasta
      POSTGRES_PASSWORD: kanasta
      POSTGRES_DB: catalog
    volumes:
      - ./catalog-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanasta -d catalog"]
      interval: 5s
      retries: 10

  orders-db:
    image: mongo:7
    volumes:
      - ./orders-service/db/seed.js:/docker-entrypoint-initdb.d/seed.js:ro
      - orders-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

volumes:
  catalog-data:
  orders-data:
