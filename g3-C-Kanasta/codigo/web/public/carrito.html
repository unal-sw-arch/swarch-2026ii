<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito | Kanasta</title>
  <link rel="icon" href="img/icono.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="index.html"><img src="img/logo.svg" alt="Kanasta" class="logo"></a>
    <nav>
      <a href="index.html">Catálogo</a>
      <a href="pedidos.html">Mis pedidos</a>
      <a href="admin.html">Administrar</a>
      <a href="carrito.html" class="cart-link">Carrito <span id="cart-count">0</span></a>
    </nav>
  </header>
  <div id="message" class="message hidden"></div>
  <main>
    <h1>Tu carrito</h1>
    <div class="cart-layout">
      <section id="cart-items"><p class="muted">Cargando carrito...</p></section>
      <aside class="panel">
        <h2>Resumen</h2>
        <p class="total">Total: <strong id="cart-total">$ 0</strong></p>
        <form id="checkout-form">
          <h3>Datos de envío</h3>
          <label>Nombre completo <input id="customer-name" required></label>
          <label>Correo electrónico <input id="customer-email" type="email" required></label>
          <label>Dirección de entrega <input id="customer-address" required></label>
          <button type="submit" id="checkout-button">Confirmar pedido</button>
          <p class="muted small">El pago se realiza contra entrega.</p>
        </form>
      </aside>
    </div>
    <section id="order-done" class="panel success hidden"></section>
  </main>
  <footer class="footer">Kanasta · Tienda en línea · Bogotá, Colombia</footer>
  <script src="js/api.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
