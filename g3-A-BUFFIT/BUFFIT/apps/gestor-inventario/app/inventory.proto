syntax = "proto3";

package inventory;

service InventoryService {
  // Verifica disponibilidad y descuenta el stock en una sola llamada atómica
  rpc ValidateAndDeductStock (StockCheckRequest) returns (StockCheckResponse);
}

message ItemQuantity {
  string product_name = 1;
  string category = 2;
  int32 quantity = 3;
}

message StockCheckRequest {
  string dining_hall = 1;
  repeated ItemQuantity items = 2;
}

message StockCheckResponse {
  bool available = 1;
  string message = 2;
}