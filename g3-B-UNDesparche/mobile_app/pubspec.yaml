name: mobile_app
description: "UNDesparche - Aplicacion movil para estudiantes y visitantes de la Universidad Nacional de Colombia"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Arquitectura, Estado e Inyeccion de Dependencias
  flutter_bloc: ^9.1.1
  get_it: ^7.7.0
  equatable: ^2.0.5

  # Red y Rutas
  dio: ^5.5.0
  go_router: ^18.1.2

  # Autenticacion (Firebase + Google Sign-In) y almacenamiento seguro del token
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.2

  # Preferencias locales (tema elegido entre sesiones)
  shared_preferences: ^2.3.2

  # Tipografia y Diseno
  google_fonts: ^6.2.1
  intl: ^0.20.2

  # Mapas y Geolocalizacion
  google_maps_flutter: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/mock_images/
    - assets/google_fonts/
