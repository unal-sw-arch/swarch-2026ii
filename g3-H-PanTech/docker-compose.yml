# Orquestación de los 5 componentes de Panadería Express.
# Funciona sin tocar nada: todas las variables tienen valores por defecto.
services:
  postgres:
    image: postgres:16-alpine
    container_name: panaderia-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-panaderia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panaderia}
      POSTGRES_DB: ${POSTGRES_DB:-panaderia}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panaderia} -d ${POSTGRES_DB:-panaderia}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - panaderia-net

  redis:
    image: redis:7-alpine
    container_name: panaderia-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - panaderia-net

  order-manager:
    build: ./order-manager
    container_name: panaderia-order-manager
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-panaderia}:${POSTGRES_PASSWORD:-panaderia}@postgres:5432/${POSTGRES_DB:-panaderia}
      SCHEDULER_URL: http://queue-scheduler:8001
    ports:
      - "${ORDER_MANAGER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      queue-scheduler:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - panaderia-net

  queue-scheduler:
    build: ./queue-scheduler
    container_name: panaderia-queue-scheduler
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-panaderia}:${POSTGRES_PASSWORD:-panaderia}@postgres:5432/${POSTGRES_DB:-panaderia}
      REDIS_URL: redis://redis:6379/0
      DELIVERED_TTL_SECONDS: ${DELIVERED_TTL_SECONDS:-3600}
    ports:
      - "${SCHEDULER_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - panaderia-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ORDER_API_URL: ${VITE_ORDER_API_URL:-http://localhost:8000}
        VITE_SCHEDULER_API_URL: ${VITE_SCHEDULER_API_URL:-http://localhost:8001}
        VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS:-3000}
    container_name: panaderia-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      order-manager:
        condition: service_healthy
      queue-scheduler:
        condition: service_healthy
    networks:
      - panaderia-net

volumes:
  postgres_data:

networks:
  panaderia-net:
    driver: bridge
