server:
  port: ${PORT:8002}

spring:
  application:
    name: identity-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/panaderia}
    username: ${DATABASE_USER:panaderia}
    password: ${DATABASE_PASSWORD:panaderia}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
  flyway:
    schemas: auth
    default-schema: auth
    create-schemas: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379/0}

identity:
  jwt:
    issuer: ${JWT_ISSUER:identity-service}
    audience: ${JWT_AUDIENCE:panaderia-express}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:/run/secrets/jwt_private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:/run/secrets/jwt_public.pem}