# =============================================================================
# Panadería Express — Prototipo 2
# Configuración de Redis.
#
# Se usa para:
#   - cola priorizada de cocina (DB 1)
#   - idempotencia de pagos (DB 0)
#   - rate limiting del Gateway (DB 0)
#   - refresh tokens (DB 0)
#   - caché (DB 2)
# =============================================================================

bind 0.0.0.0
protected-mode yes
port 6379

# Persistencia: AOF para no perder la cola si el contenedor se reinicia.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
dir /data

# Snapshot como respaldo adicional.
save 900 1
save 300 10
save 60 10000

# No expulsar llaves: la cola y los refresh tokens no pueden perderse.
maxmemory-policy noeviction

# Conexiones y timeouts.
timeout 0
tcp-keepalive 300

# Logs.
loglevel notice
