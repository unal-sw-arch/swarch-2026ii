# =============================================================================
# Panadería Express — Prototipo 2
# Configuración de RabbitMQ.
#
# El usuario y la contraseña los crea la imagen oficial a partir de
# RABBITMQ_DEFAULT_USER y RABBITMQ_DEFAULT_PASS del compose.
# =============================================================================

# Carga exchanges, colas, bindings y DLQ al arrancar.
load_definitions = /etc/rabbitmq/definitions.json

# Consola de administración.
management.tcp.port = 15672

# Límites razonables para un entorno local.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Logs en consola para que `docker compose logs` sea útil.
log.console = true
log.console.level = info
